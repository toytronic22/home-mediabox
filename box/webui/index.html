<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234c9aff' stroke-width='2' stroke-linecap='round'%3E%3Crect x='2.5' y='4' width='19' height='7' rx='2'/%3E%3Crect x='2.5' y='13' width='19' height='7' rx='2'/%3E%3Cpath d='M6 7.5h.01M6 16.5h.01'/%3E%3C/svg%3E">
<title>Home Station</title>
<style>
  :root {
    --bg: #12151c;
    --bg-soft: #181c25;
    --card: #1e2430;
    --card-hi: #263041;
    --line: #2c3444;
    --text: #e8ecf4;
    --dim: #8e99ad;
    --accent: #4c9aff;
    --accent-soft: rgba(76, 154, 255, .14);
    --danger: #ff5f56;
    --ok: #3ddc84;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Собственный display у элемента сильнее браузерного правила для hidden: без этой
     строки спрятанное скриптом всё равно остаётся на экране. */
  [hidden] { display: none !important; }
  /* clip, а не hidden: hidden сделал бы body отдельной прокруткой, и шапка перестала бы липнуть */
  html, body { margin: 0; padding: 0; overflow-x: clip; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }

  /* ---------- шапка ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(18, 21, 28, .93);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .head-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px 10px;
    max-width: 1100px; margin: 0 auto;
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    font-weight: 650; font-size: 16px; letter-spacing: .2px; white-space: nowrap;
  }
  .logo svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .disk {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--dim); white-space: nowrap;
  }
  .gauge { width: 74px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .gauge > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

  /* ---------- панель действий ---------- */
  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0 16px 12px; max-width: 1100px; margin: 0 auto;
  }
  .search {
    position: relative; flex: 1 1 220px; min-width: 150px;
  }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--dim); }
  .search input {
    width: 100%; padding: 10px 34px 10px 34px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    outline: none; transition: border-color .15s, background .15s;
  }
  .search input:focus { border-color: var(--accent); background: var(--bg-soft); }
  .search .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; padding: 6px 8px; color: var(--dim); cursor: pointer; display: none;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 14px; border-radius: 11px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    transition: background .15s, border-color .15s, transform .08s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--line); flex: none; }
  .btn.warn { color: var(--danger); border-color: rgba(255,95,86,.4); }
  .btn.warn:hover { background: rgba(255,95,86,.12); }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  /* ---------- вкладки ---------- */
  .tabs {
    display: flex; align-items: center; gap: 6px;
    padding: 0 16px 10px; max-width: 1100px; margin: 0 auto;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 11px; cursor: pointer;
    background: transparent; border: 1px solid transparent; color: var(--dim);
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab svg { width: 16px; height: 16px; flex: none; }
  .tab:hover { color: var(--text); background: var(--card); }
  .tab.on { color: var(--text); background: var(--card-hi); border-color: var(--line); font-weight: 600; }
  .tab-out { margin-left: auto; font-size: 13px; color: var(--dim); padding: 6px 8px; border-radius: 8px; }
  .tab-out:hover { color: var(--text); background: var(--card); }

  /* ---------- загрузки ---------- */
  .dlpane { max-width: 1100px; margin: 0 auto; padding: 0 16px 26px; }
  .dlbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; }
  .dlsum { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim);
           font-variant-numeric: tabular-nums; }
  .dlcap { cursor: pointer; border-bottom: 1px dashed currentColor; }
  .dllist { background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .dlrow { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .dlrow:last-child { border-bottom: 0; }
  .dlrow:hover { background: var(--card); }
  .dlhead { display: flex; align-items: center; gap: 10px; }
  .dlname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlpct { flex: none; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .dlrow .track { margin: 9px 0 7px; }
  .dlrow .track.done > i { background: var(--ok); }
  .dlrow .track.idle > i { background: var(--dim); }
  .dlrow .track.bad > i { background: var(--danger); }
  .dlmeta { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim);
            font-variant-numeric: tabular-nums; }
  .dlrow .more svg { width: 18px; height: 18px; }
  .dlempty { padding: 44px 16px; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.7; }
  .dlnote {
    max-width: 440px; margin: 40px auto; padding: 0 16px;
    text-align: center; color: var(--dim);
  }
  .dlnote h3 { margin: 0 0 8px; color: var(--text); font-size: 17px; }
  .dlnote p { margin: 0 0 16px; font-size: 14px; }
  .dlnote .btn { margin: 0 4px; }

  /* На вкладке качалки файловые кнопки, крошки и список не нужны, а кнопки питания остаются. */
  body.dl-mode .files-only,
  body.dl-mode .crumbs,
  body.dl-mode main,
  body.dl-mode .selbar { display: none !important; }
  body.dl-mode { padding-bottom: 0; }

  /* ---------- VPN: панель роутера живёт на своём порту (:8778), тут она в рамке ---------- */
  body.vpn-mode .bar,
  body.vpn-mode .crumbs,
  body.vpn-mode main,
  body.vpn-mode .selbar { display: none !important; }
  body.vpn-mode { padding-bottom: 0; overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  body.vpn-mode header { flex: none; }
  .vpnpane { flex: 1; min-height: 0; }
  .vpnpane[hidden] { display: none; }
  .vpnpane iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

  /* ---------- крошки ---------- */
  .crumbs {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 0 16px 12px; max-width: 1100px; margin: 0 auto;
    font-size: 14px; color: var(--dim);
  }
  .crumbs a, .crumbs span.here {
    padding: 5px 9px; border-radius: 8px;
  }
  .crumbs a:hover { background: var(--card); color: var(--text); }
  .crumbs span.here { color: var(--text); font-weight: 600; }
  .crumbs i { opacity: .45; font-style: normal; }

  /* ---------- список ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--bg-soft); }
  .lhead {
    display: grid; grid-template-columns: 40px 1fr 110px 150px 44px;
    align-items: center; gap: 10px;
    padding: 10px 14px; font-size: 12.5px; color: var(--dim);
    background: var(--card); border-bottom: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .lhead button {
    background: none; border: 0; padding: 0; cursor: pointer; color: inherit;
    display: inline-flex; align-items: center; gap: 4px; text-transform: inherit; letter-spacing: inherit;
    font-size: inherit;
  }
  .lhead button:hover { color: var(--text); }
  .lhead .arrow { opacity: 0; font-size: 10px; }
  .lhead button.on { color: var(--accent); }
  .lhead button.on .arrow { opacity: 1; }

  .row {
    display: grid; grid-template-columns: 40px 1fr 110px 150px 44px;
    align-items: center; gap: 10px;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; transition: background .12s;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--card); }
  .row.sel { background: var(--accent-soft); }
  .row .ic { width: 26px; height: 26px; display: grid; place-items: center; color: var(--dim); }
  .row .ic svg { width: 21px; height: 21px; }
  .row.dir .ic { color: var(--accent); }
  .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { display: none; color: var(--dim); font-size: 12.5px; }
  .size, .date { color: var(--dim); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .date { white-space: nowrap; }
  .more {
    background: none; border: 0; padding: 7px; border-radius: 9px;
    color: var(--dim); cursor: pointer; display: grid; place-items: center;
  }
  .more:hover { background: var(--card-hi); color: var(--text); }
  .check {
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line);
    display: grid; place-items: center; flex: none; background: var(--bg);
  }
  .row.sel .check { background: var(--accent); border-color: var(--accent); }
  .check svg { width: 13px; height: 13px; opacity: 0; color: #fff; }
  .row.sel .check svg { opacity: 1; }

  .empty { padding: 54px 20px; text-align: center; color: var(--dim); }
  .empty svg { width: 46px; height: 46px; opacity: .35; margin-bottom: 12px; }
  .empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }

  /* ---------- меню строки ---------- */
  .menu {
    position: fixed; z-index: 60; min-width: 208px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 18px 44px rgba(0,0,0,.5); padding: 6px; display: none;
  }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 11px; background: none; border: 0; border-radius: 8px;
    cursor: pointer; text-align: left;
  }
  .menu button:hover { background: var(--card-hi); }
  .menu button.danger { color: var(--danger); }
  .menu svg { width: 16px; height: 16px; flex: none; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  /* выбор папки и мастер серий */
  .modal.wide { max-width: 560px; }
  .pf-cur { display: flex; align-items: center; gap: 7px; font-size: 13px;
    color: var(--dim); margin: 0 0 10px; word-break: break-word; }
  .pf-cur svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
  .pf-row[disabled] { opacity: .4; cursor: default; }
  .pf-list, .ep-list { max-height: 46vh; overflow: auto; margin: 0 0 16px;
    border: 1px solid var(--line); border-radius: 12px; }
  .pf-row { display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 11px 12px; background: none; border: 0; border-bottom: 1px solid var(--line);
    color: var(--text); font-size: 14px; text-align: left; cursor: pointer; }
  .pf-row:last-child { border-bottom: 0; }
  .pf-row:hover { background: var(--card-hi); }
  .pf-row svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .pf-row.pf-up svg { color: var(--dim); }
  .pf-empty, .pf-load { padding: 14px; color: var(--dim); font-size: 13px; text-align: center; }
  .ep-form { display: flex; gap: 10px; margin: 0 0 6px; }
  .ep-form label { flex: 1; display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--dim); }
  .ep-form label.season { flex: 0 0 96px; }
  .ep-form input { margin: 0; }
  .ep-note { font-size: 12px; color: var(--dim); margin: 4px 0 12px; }
  .ep-note b { color: var(--text); font-weight: 600; }
  .ep-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); font-size: 13px; }
  .ep-row:last-child { border-bottom: 0; }
  .ep-row.skip { opacity: .5; }
  .ep-old { flex: 1 1 0; min-width: 0; color: var(--dim); word-break: break-all; }
  .ep-arr { color: var(--dim); flex: none; }
  .ep-new { flex: 1 1 0; min-width: 0; color: var(--text); word-break: break-all; }
  .ep-new.bad { color: var(--danger); }
  .ep-row input.epnum { width: 58px; padding: 5px 7px; margin: 0; }

  /* ---------- нижняя панель выбора ---------- */
  .selbar {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 130%);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 15px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
    transition: transform .22s cubic-bezier(.2,.9,.3,1); z-index: 50;
    max-width: calc(100vw - 24px);
  }
  .selbar.on { transform: translate(-50%, 0); }
  .selbar .cnt { padding: 0 6px; font-weight: 600; white-space: nowrap; }

  /* ---------- модальные окна ---------- */
  .veil {
    position: fixed; inset: 0; background: rgba(6,8,12,.66); backdrop-filter: blur(3px);
    display: none; place-items: center; z-index: 80; padding: 18px;
  }
  .veil.on { display: grid; }
  .modal {
    width: 100%; max-width: 420px; background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: 0 26px 60px rgba(0,0,0,.55);
  }
  .modal h3 { margin: 0 0 6px; font-size: 17px; }
  .modal p { margin: 0 0 16px; color: var(--dim); font-size: 14px; word-break: break-word; }
  .modal input, .modal textarea {
    width: 100%; padding: 11px 13px; margin-bottom: 16px;
    font: inherit; color: inherit; resize: vertical;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px; outline: none;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal .acts { display: flex; flex-wrap: wrap; gap: 9px; justify-content: flex-end; }

  /* ---------- загрузка ---------- */
  .up {
    position: fixed; right: 16px; bottom: 16px; z-index: 55;
    width: 290px; max-width: calc(100vw - 32px);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 44px rgba(0,0,0,.5); padding: 13px 14px; display: none;
  }
  .up.on { display: block; }
  .up .t { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 14px; }
  .up .t b { font-weight: 600; }
  .up .t button { margin-left: auto; background: none; border: 0; color: var(--dim); cursor: pointer; padding: 2px 4px; }
  .up .nm { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 7px; }
  .track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .track > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .18s; }

  /* ---------- сообщения ---------- */
  .toasts { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 15px; border-radius: 12px; font-size: 14px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
    animation: pop .22s cubic-bezier(.2,.9,.3,1);
  }
  .toast.ok { border-color: rgba(61,220,132,.45); }
  .toast.err { border-color: rgba(255,95,86,.5); }
  .toast svg { width: 17px; height: 17px; flex: none; }
  .toast.ok svg { color: var(--ok); }
  .toast.err svg { color: var(--danger); }
  @keyframes pop { from { opacity: 0; transform: translateY(-9px) } to { opacity: 1; transform: none } }

  /* ---------- перетаскивание ---------- */
  .drop {
    position: fixed; inset: 0; z-index: 70; display: none;
    place-items: center; background: rgba(76,154,255,.1);
    border: 3px dashed var(--accent); border-radius: 18px; margin: 10px;
    font-size: 17px; font-weight: 600; pointer-events: none;
  }
  .drop.on { display: grid; }

  .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg) } }

  /* ---------- телефон ---------- */
  @media (max-width: 700px) {
    .tab-out { display: none; }
    /* На узком экране кнопки в строку не влезают: панель во всю ширину, кнопки переносятся */
    .selbar { left: 12px; right: 12px; max-width: none; transform: translateY(130%);
              flex-wrap: wrap; justify-content: center; }
    .selbar.on { transform: translateY(0); }
    .lhead { grid-template-columns: 40px 1fr 44px; }
    .lhead .hsize, .lhead .hdate { display: none; }
    .row { grid-template-columns: 40px 1fr 44px; padding: 12px 12px; }
    .row .size, .row .date { display: none; }
    .sub { display: block; }
    /* на узком экране: иконка слева, имя и подпись — в две строки справа от неё */
    .name {
      display: grid; grid-template-columns: 26px 1fr; column-gap: 10px; row-gap: 1px;
    }
    .name .ic { grid-area: 1 / 1 / 3 / 2; align-self: center; }
    .name .t  { grid-area: 1 / 2 / 2 / 3; }
    .name .sub { grid-area: 2 / 2 / 3 / 3; }
    .disk .txt { display: none; }
    body { padding-bottom: 100px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="2.5" y="4" width="19" height="7" rx="2"/><rect x="2.5" y="13" width="19" height="7" rx="2"/>
        <path d="M6 7.5h.01M6 16.5h.01"/>
      </svg>
      <span>Home Station</span>
    </div>
    <div class="disk" id="disk" hidden>
      <div class="gauge"><i id="gaugeFill"></i></div>
      <span id="diskText" class="txt"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab" data-tab="vpn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/>
      </svg>
      <span>Сеть</span>
    </button>
    <button class="tab" data-tab="files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <span>Файлы</span>
    </button>
    <button class="tab" data-tab="dl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
      </svg>
      <span>Загрузки</span>
    </button>
    <a class="tab-out" id="dlOut" target="_blank" rel="noopener" hidden>Полная качалка ↗</a>
  </div>

  <div class="bar">
    <label class="search files-only">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="Поиск по диску" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qClear" title="Очистить">✕</button>
    </label>
    <button class="btn files-only" id="btnUp" title="Загрузить файлы">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>

<script>
'use strict';

const ICONS = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  video:  '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="m10 9.5 5 2.5-5 2.5z"/>',
  audio:  '<path d="M9 18V7l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  image:  '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4 4 3 3-2 4 3"/>',
  archive:'<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M12 3.5v5M10.5 8.5h3M12 11v3"/>',
  text:   '<path d="M6 3.5h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/><path d="M14 3.5v4h4M8.5 13h7M8.5 16.5h5"/>',
  sub:    '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M6.5 14.5h5M14 14.5h3.5"/>',
  file:   '<path d="M6 3.5h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z"/><path d="M14 3.5v4h4"/>',
  check:  '<path d="m4 12 6 6L20 6"/>',
  dots:   '<circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/>',
  down:   '<path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>',
  pen:    '<path d="M4 20h4L20 8l-4-4L4 16z"/><path d="m14.5 5.5 4 4"/>',
  trash:  '<path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/>',
  link:   '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  ok:     '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  warn:   '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  box:    '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  move:   '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h5a2 2 0 0 1 2 2v2.5"/><path d="M12 16h9"/><path d="m18 13 3 3-3 3"/>',
  tv:     '<rect x="2.5" y="6.5" width="19" height="12" rx="2.5"/><path d="m8 3.5 4 3 4-3"/>',
  up:     '<path d="M20 18v-3a4 4 0 0 0-4-4H5"/><path d="m9 7-4 4 4 4"/>',
  pause:  '<path d="M9.5 5v14M14.5 5v14"/>',
  play:   '<path d="M7.5 4.8v14.4L19.5 12z"/>'
};
const EXT = {
  video: 'mkv mp4 avi mov m4v ts m2ts wmv flv webm mpg mpeg iso vob 3gp',
  audio: 'mp3 flac wav m4a aac ogg opus wma ape dsf',
  image: 'jpg jpeg png gif webp bmp heic avif svg',
  archive: 'zip rar 7z tar gz bz2 xz tgz',
  text: 'txt log json xml csv md nfo ini conf yml yaml',
  sub: 'srt ass ssa sub vtt idx'
};
const KIND = {};
for (const k in EXT) for (const e of EXT[k].split(' ')) KIND[e] = k;

const svg = (d, w) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
  (w || 1.7) + '" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

const $ = s => document.querySelector(s);
const rowsEl = $('#rows'), crumbsEl = $('#crumbs');

let cwd = decodeURIComponent(location.pathname);
let items = [], sortKey = 'name', sortDir = 1, selected = new Set(), searching = '';
let caps = { upload: true, delete: true, archive: true };

/* ---------- утилиты ---------- */
function fmtSize(b, dir) {
  if (dir) return b > 0 ? '…' : 'пусто';
  if (b < 1024) return b + ' Б';
  const u = ['КБ', 'МБ', 'ГБ', 'ТБ'];
  let i = -1, v = b;
  do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
  return (v >= 100 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
}
function fmtDate(ms) {
  if (!ms) return '—';
  const d = new Date(ms), now = new Date();
  const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'сегодня, ' + time;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчера, ' + time;
  const opt = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== now.getFullYear()) opt.year = 'numeric';
  return d.toLocaleDateString('ru-RU', opt) + ', ' + time;
}
function kindOf(p) {
  if (p.path_type.indexOf('Dir') >= 0) return 'folder';
  const dot = p.name.lastIndexOf('.');
  return (dot > 0 && KIND[p.name.slice(dot + 1).toLowerCase()]) || 'file';
}
const isDir = p => p.path_type.indexOf('Dir') >= 0;
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const join = (dir, name) => (dir.endsWith('/') ? dir : dir + '/') + name;

function toast(text, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = svg(type === 'err' ? ICONS.warn : ICONS.ok, 2) + '<span></span>';
  el.querySelector('span').textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0';
                     setTimeout(() => el.remove(), 260); }, type === 'err' ? 5200 : 2600);
}

/* ---------- диалоги ---------- */
function dialog(html, onOpen) {
  $('#modal').innerHTML = html;
  $('#veil').classList.add('on');
  if (onOpen) onOpen($('#modal'));
}
const closeDialog = () => { $('#veil').classList.remove('on'); $('#modal').classList.remove('wide'); };
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeDialog(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDialog(); hideMenu(); }
});

function ask(title, note, okText, danger) {
  return new Promise(res => {
    dialog('<h3></h3><p></p><div class="acts">' +
      '<button class="btn ghost" data-no>Отмена</button>' +
      '<button class="btn ' + (danger ? 'warn' : 'primary') + '" data-yes></button></div>',
      m => {
        m.querySelector('h3').textContent = title;
        m.querySelector('p').textContent = note;
        m.querySelector('[data-yes]').textContent = okText;
        m.querySelector('[data-no]').onclick = () => { closeDialog(); res(false); };
        m.querySelector('[data-yes]').onclick = () => { closeDialog(); res(true); };
        m.querySelector('[data-yes]').focus();
      });
  });
}
function prompt2(title, note, value, okText) {
  return new Promise(res => {
    dialog('<h3></h3><p></p><input type="text"><div class="acts">' +
      '<button class="btn ghost" data-no>Отмена</button>' +
      '<button class="btn primary" data-yes></button></div>',
      m => {
        m.querySelector('h3').textContent = title;
        m.querySelector('p').textContent = note;
        const inp = m.querySelector('input');
        inp.value = value || '';
        m.querySelector('[data-yes]').textContent = okText;
        const done = () => { const v = inp.value.trim(); closeDialog(); res(v || null); };
        m.querySelector('[data-no]').onclick = () => { closeDialog(); res(null); };
        m.querySelector('[data-yes]').onclick = done;
        inp.onkeydown = e => { if (e.key === 'Enter') done(); };
        inp.focus();
        const dot = (value || '').lastIndexOf('.');
        if (dot > 0) inp.setSelectionRange(0, dot); else inp.select();
      });
  });
}

/* ---------- загрузка данных ---------- */
async function load(path, opts) {
  opts = opts || {};
  const spin = setTimeout(() => {
    rowsEl.innerHTML = '<div class="empty">' + svg(ICONS.box, 1.6) + '<b>Читаем папку…</b></div>';
  }, 250);
  try {
    const url = searching
      ? '/?q=' + encodeURIComponent(searching) + '&json'
      : enc(path) + (path.endsWith('/') ? '' : '/') + '?json';
    const r = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    clearTimeout(spin);
    caps = { upload: data.allow_upload !== false,
             delete: data.allow_delete !== false,
             archive: data.allow_archive !== false };
    items = data.paths || [];
    cwd = searching ? cwd : path;
    selected.clear();
    render();
    if (!opts.keepUrl && !searching) {
      const target = enc(path) + (path.endsWith('/') ? '' : '/');
      if (decodeURIComponent(location.pathname) !== decodeURIComponent(target)) {
        history.pushState({ path }, '', target);
      }
    }
  } catch (e) {
    clearTimeout(spin);
    rowsEl.innerHTML = '<div class="empty">' + svg(ICONS.warn, 1.6) +
      '<b>Не удалось прочитать папку</b>Проверьте, подключён ли диск</div>';
    toast('Ошибка: ' + e.message, 'err');
  }
}

/* ---------- отрисовка ---------- */
/** Вес для сортировки: у папки — посчитанный, пока не посчитан — в конец списка. */
function sortSize(p) {
  if (!isDir(p)) return p.size || 0;
  const v = sizeCache.get(pathOf(p));
  return v == null ? -1 : v;
}

function sortItems() {
  const dirFirst = (a, b) => (isDir(b) ? 1 : 0) - (isDir(a) ? 1 : 0);
  items.sort((a, b) => {
    const d = dirFirst(a, b);
    if (d) return d;
    let r;
    if (sortKey === 'size') r = sortSize(a) - sortSize(b);
    else if (sortKey === 'mtime') r = (a.mtime || 0) - (b.mtime || 0);
    else r = a.name.localeCompare(b.name, 'ru', { numeric: true, sensitivity: 'base' });
    return r * sortDir;
  });
}

function render(opts) {
  opts = opts || {};
  sortItems();
  renderCrumbs();

  if (!items.length) {
    rowsEl.innerHTML = '<div class="empty">' + svg(ICONS.box, 1.6) +
      (searching ? '<b>Ничего не нашлось</b>Попробуйте другое слово'
                 : '<b>Папка пуста</b>Перетащите сюда файлы, чтобы загрузить') + '</div>';
    updateSelBar();
    return;
  }

  const frag = document.createDocumentFragment();
  items.forEach((p, idx) => {
    const dir = isDir(p), kind = kindOf(p);
    const row = document.createElement('div');
    row.className = 'row' + (dir ? ' dir' : '');
    row.dataset.i = idx;
    row.innerHTML =
      '<div><span class="check">' + svg(ICONS.check, 3) + '</span></div>' +
      '<div class="name"><span class="ic">' + svg(ICONS[kind]) + '</span>' +
        '<span class="t"></span><span class="sub"></span></div>' +
      '<div class="size"></div>' +
      '<div class="date"></div>' +
      '<button class="more" title="Действия">' + svg(ICONS.dots, 1) + '</button>';
    const nm = searching ? p.name : p.name.split('/').pop();
    row.querySelector('.t').textContent = nm;
    const known = dir ? sizeCache.get(pathOf(p)) : null;
    const sizeTxt = dir
      ? (known != null ? fmtSize(known, false) : fmtSize(p.size, true))
      : fmtSize(p.size, false);
    row.querySelector('.sub').textContent = sizeTxt + ' · ' + fmtDate(p.mtime);
    row.querySelector('.size').textContent = sizeTxt;
    row.querySelector('.date').textContent = fmtDate(p.mtime);
    frag.appendChild(row);
  });
  rowsEl.innerHTML = '';
  rowsEl.appendChild(frag);
  updateSelBar();
  if (!opts.skipCalc) fillDirSizes();
}

function renderCrumbs() {
  if (searching) {
    crumbsEl.innerHTML = '<a href="#" data-path="/">Диск</a><i>/</i><span class="here"></span>';
    crumbsEl.querySelector('.here').textContent = 'поиск: ' + searching;
    return;
  }
  const parts = cwd.split('/').filter(Boolean);
  let html = '<a href="#" data-path="/">Диск</a>', acc = '';
  parts.forEach((seg, i) => {
    acc += '/' + seg;
    html += '<i>/</i>';
    html += (i === parts.length - 1)
      ? '<span class="here">' + escapeHtml(decodeURIComponent(seg)) + '</span>'
      : '<a href="#" data-path="' + escapeHtml(acc) + '">' + escapeHtml(decodeURIComponent(seg)) + '</a>';
  });
  crumbsEl.innerHTML = html;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- вес папок ----------
   dufs в листинге отдаёт у папки только число элементов, поэтому вес считаем сами:
   обходим вложенные папки и складываем размеры файлов. Результат держим в кэше —
   один и тот же фильм не пересчитываем при каждом возврате в папку. Бюджет запросов
   ограничен: на огромном дереве лучше показать прочерк, чем надолго занять сеть. */
const sizeCache = new Map();
let budget = 0, calcToken = 0;

async function dirSize(path, depth) {
  if (sizeCache.has(path)) return sizeCache.get(path);
  if (depth > 8 || budget <= 0) return null;
  budget--;
  let total = 0;
  try {
    const r = await fetch(enc(path) + '/?json', { headers: { Accept: 'application/json' } });
    if (!r.ok) return null;
    const d = await r.json();
    const subs = [];
    for (const it of (d.paths || [])) {
      if (isDir(it)) subs.push(join(path, it.name));
      else total += it.size || 0;
    }
    const parts = await Promise.all(subs.map(sd => dirSize(sd, depth + 1)));
    for (const v of parts) {
      if (v === null) return null;      // недосчитали — честнее показать прочерк
      total += v;
    }
  } catch (e) { return null; }
  sizeCache.set(path, total);
  return total;
}

/** Дозаполняет колонку «размер» у папок текущего списка. */
async function fillDirSizes() {
  const token = ++calcToken;
  budget = 600;
  const dirs = [];
  rowsEl.querySelectorAll('.row.dir').forEach(row => {
    const p = items[+row.dataset.i];
    if (p && (p.size || 0) > 0 && !sizeCache.has(pathOf(p))) dirs.push({ row, p });
  });
  for (const { row, p } of dirs) {
    if (token !== calcToken) return;               // ушли в другую папку — считать незачем
    const cell = row.querySelector('.size'), sub = row.querySelector('.sub');
    const bytes = await dirSize(pathOf(p), 1);
    if (token !== calcToken) return;
    const txt = bytes === null ? '—' : fmtSize(bytes, false);
    cell.textContent = txt;
    cell.title = p.size + ' ' + plural(p.size, 'объект', 'объекта', 'объектов');
    sub.textContent = txt + ' · ' + fmtDate(p.mtime);
  }
  if (sortKey === 'size' && dirs.length && token === calcToken) render({ skipCalc: true });
  else if (dirs.length && token === calcToken) { /* значения уже подставлены по месту */ }
}

/* ---------- выбор ---------- */
function updateSelBar() {
  const n = selected.size;
  $('#selCnt').textContent = n + ' ' + plural(n, 'объект', 'объекта', 'объектов');
  $('#selbar').classList.toggle('on', n > 0);
  $('#selDel').style.display = caps.delete ? '' : 'none';
  $('#selZip').style.display = caps.archive ? '' : 'none';
  rowsEl.querySelectorAll('.row').forEach(r => {
    r.classList.toggle('sel', selected.has(+r.dataset.i));
  });
  $('#checkAll').parentElement.parentElement &&
    $('#checkAll').classList.toggle('all', n && n === items.length);
}
function plural(n, one, few, many) {
  const m = n % 100, k = n % 10;
  if (m > 10 && m < 20) return many;
  if (k === 1) return one;
  if (k >= 2 && k <= 4) return few;
  return many;
}

/* ---------- действия ---------- */
function pathOf(p) {
  return searching ? '/' + p.name : join(cwd, p.name);
}

async function doDelete(list) {
  const names = list.map(p => p.name.split('/').pop());
  const note = list.length === 1
    ? 'Удалить «' + names[0] + '» безвозвратно?'
    : 'Удалить безвозвратно ' + list.length + ' ' + plural(list.length, 'объект', 'объекта', 'объектов') +
      '?\n' + names.slice(0, 4).join(', ') + (names.length > 4 ? ' и ещё ' + (names.length - 4) : '');
  if (!await ask('Удаление', note, 'Удалить', true)) return;

  let ok = 0, fail = 0;
  for (const p of list) {
    try {
      const r = await fetch(enc(pathOf(p)), { method: 'DELETE' });
      r.ok ? ok++ : fail++;
    } catch (e) { fail++; }
  }
  if (ok) toast('Удалено: ' + ok, 'ok');
  if (fail) toast('Не удалось удалить: ' + fail, 'err');
  refresh();
}

async function doRename(p) {
  const old = p.name.split('/').pop();
  const name = await prompt2('Переименовать', 'Новое имя для «' + old + '»', old, 'Сохранить');
  if (!name || name === old) return;
  if (name.includes('/')) { toast('В имени нельзя использовать «/»', 'err'); return; }
  const from = pathOf(p);
  const to = join(from.slice(0, from.lastIndexOf('/')) || '/', name);
  try {
    const r = await fetch(enc(from), {
      method: 'MOVE',
      headers: { Destination: location.origin + enc(to) }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    toast('Переименовано', 'ok');
    refresh();
  } catch (e) { toast('Не переименовать: ' + e.message, 'err'); }
}

async function doMkdir() {
  const name = await prompt2('Новая папка', (cwd === '/' ? 'Создадим в корне диска' : 'Создадим в «' + decodeURIComponent(cwd).replace(/^\//, '').replace(/\/$/, '') + '»'), '', 'Создать');
  if (!name) return;
  try {
    const r = await fetch(enc(join(cwd, name)) + '/', { method: 'MKCOL' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    toast('Папка создана', 'ok');
    refresh();
  } catch (e) { toast('Не создать папку: ' + e.message, 'err'); }
}

/* ---------- перемещение между папками ---------- */
const rstrip = s => (s || '/').replace(/\/+$/, '') || '/';

/** Диалог выбора папки-назначения. block — папки, куда нельзя (сам объект и его нутро). */
function pickFolder(startPath, opts, okText) {
  opts = opts || {};
  const block = (opts.block || []).map(rstrip);
  const blocked = path => {
    const n = rstrip(path);
    return block.some(b => n === b || n.startsWith(b + '/'));
  };
  return new Promise(res => {
    let cur = rstrip(startPath);
    dialog(
      '<h3>Куда переместить</h3>' +
      '<div class="pf-cur"></div><div class="pf-list"></div>' +
      '<div class="acts"><button class="btn ghost" data-no>Отмена</button>' +
      '<button class="btn primary" data-yes></button></div>',
      m => {
        $('#modal').classList.add('wide');
        const curEl = m.querySelector('.pf-cur');
        const listEl = m.querySelector('.pf-list');
        const okBtn = m.querySelector('[data-yes]');
        okBtn.textContent = okText || 'Сюда';
        m.querySelector('[data-no]').onclick = () => { closeDialog(); res(null); };
        okBtn.onclick = () => { if (!okBtn.disabled) { closeDialog(); res(cur); } };
        const show = async () => {
          curEl.innerHTML = svg(ICONS.folder) + '<span></span>';
          curEl.querySelector('span').textContent =
            cur === '/' ? 'Корень диска' : decodeURIComponent(cur).replace(/^\//, '');
          okBtn.disabled = blocked(cur);
          listEl.innerHTML = '<div class="pf-load">Читаем…</div>';
          let dirs;
          try {
            const r = await fetch(enc(cur) + (cur.endsWith('/') ? '' : '/') + '?json',
              { headers: { Accept: 'application/json' } });
            const data = await r.json();
            dirs = (data.paths || []).filter(isDir).sort((a, b) =>
              a.name.localeCompare(b.name, 'ru', { numeric: true, sensitivity: 'base' }));
          } catch (e) { listEl.innerHTML = '<div class="pf-empty">Не удалось прочитать папку</div>'; return; }
          let html = '';
          if (cur !== '/') html += '<button class="pf-row pf-up" data-up>' + svg(ICONS.up) + 'На уровень выше</button>';
          for (const d of dirs)
            html += '<button class="pf-row" data-go="' + escapeHtml(d.name) + '"' +
              (blocked(join(cur, d.name)) ? ' disabled' : '') + '>' + svg(ICONS.folder) + '<span></span></button>';
          if (!dirs.length) html += '<div class="pf-empty">' + (cur === '/' ? 'Нет папок' : 'Внутри нет папок') + '</div>';
          listEl.innerHTML = html;
          listEl.querySelectorAll('[data-go]').forEach(b => {
            b.querySelector('span').textContent = b.getAttribute('data-go');
            if (!b.disabled) b.onclick = () => { cur = join(cur, b.getAttribute('data-go')); show(); };
          });
          const up = listEl.querySelector('[data-up]');
          if (up) up.onclick = () => { cur = rstrip(cur).replace(/\/[^/]*$/, '') || '/'; show(); };
        };
        show();
      });
  });
}

async function doMove(list) {
  list = (list || []).filter(Boolean);
  if (!list.length) return;
  const movingDirs = list.filter(isDir).map(p => pathOf(p));
  const dest = await pickFolder(cwd, { block: movingDirs }, 'Переместить сюда');
  if (dest == null) return;
  const base = rstrip(dest) === '/' ? '' : rstrip(dest);
  const human = base === '' ? 'корень диска' : decodeURIComponent(base.replace(/^\//, ''));

  // dufs молча перезаписывает при совпадении имён (Overwrite: F он игнорирует),
  // поэтому сверяемся сами: что уже лежит в папке-назначении.
  let destNames;
  try {
    const r = await fetch(enc(rstrip(dest)) + '/?json', { headers: { Accept: 'application/json' } });
    destNames = new Set(((await r.json()).paths || []).map(p => p.name.split('/').pop()));
  } catch (e) { toast('Не удалось прочитать папку-назначение', 'err'); return; }

  const moved = list.map(p => ({ from: pathOf(p), name: p.name.split('/').pop() }))
    .map(j => ({ ...j, to: base + '/' + j.name }))
    .filter(j => j.to !== j.from);                    // «само в себя» — пропускаем
  if (!moved.length) { toast('Уже в этой папке', 'err'); return; }

  const collide = moved.filter(j => destNames.has(j.name));
  let replace = true;
  if (collide.length) {
    const names = collide.map(j => j.name).slice(0, 4).join(', ') +
      (collide.length > 4 ? ' и ещё ' + (collide.length - 4) : '');
    replace = await ask('Имена уже заняты',
      'В «' + human + '» уже есть ' + collide.length + ' ' +
      plural(collide.length, 'объект', 'объекта', 'объектов') + ' с такими именами:\n' + names +
      '\n\n«Заменить» — перезаписать их. «Отмена» — перенести только остальные.',
      'Заменить', true);
  }
  const jobs = replace ? moved : moved.filter(j => !destNames.has(j.name));
  if (!jobs.length) { toast('Ничего не перемещено — имена заняты', 'err'); return; }

  let ok = 0, fail = 0;
  for (const j of jobs) {
    try {
      const r = await fetch(enc(j.from), {
        method: 'MOVE', headers: { Destination: location.origin + enc(j.to) } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      ok++;
    } catch (e) { fail++; }
  }
  const skipped = moved.length - jobs.length;
  if (ok) toast('Перемещено в «' + human + '»: ' + ok, 'ok');
  if (skipped) toast('Пропущено (имя занято): ' + skipped, 'err');
  if (fail) toast('Не перемещено: ' + fail, 'err');
  selected.clear();
  refresh();
}

/* ---------- мастер: серии под формат Kodi ---------- */
const pad2 = n => String(n).padStart(2, '0');

/** Достаёт сезон/номер из имени файла; e — обязателен, s — если нашёлся. */
function guessEp(name) {
  const base = name.replace(/\.[^.]+$/, '');
  let m = base.match(/s(\d{1,2})\s*[._\-x ]?\s*e(\d{1,3})/i);
  if (m) return { s: +m[1], e: +m[2] };
  m = base.match(/(?:^|[^\d])(\d{1,2})x(\d{1,3})(?!\d)/i);
  if (m) return { s: +m[1], e: +m[2] };
  m = base.match(/\b(?:e|ep|эп|episode|серия)\.?\s*(\d{1,3})\b/i);
  if (m) return { e: +m[1] };
  const cleaned = base.replace(/\b(?:19|20)\d{2}\b/g, ' ')
                      .replace(/\b\d{3,4}p\b/gi, ' ')
                      .replace(/\bx?26[45]\b/gi, ' ')
                      .replace(/\b(?:10|8)\s*bit\b/gi, ' ');
  const nums = cleaned.match(/\d{1,3}/g);
  if (nums && nums.length) return { e: +nums[nums.length - 1] };
  return {};
}

async function doEpisodes() {
  const vids = items.filter(p => !isDir(p) && kindOf(p) === 'video')
    .sort((a, b) => a.name.localeCompare(b.name, 'ru', { numeric: true, sensitivity: 'base' }));
  if (!vids.length) { toast('В этой папке нет видеофайлов', 'err'); return; }

  const segs = decodeURIComponent(cwd).split('/').filter(Boolean);
  const here = segs[segs.length - 1] || '';
  const parent = segs[segs.length - 2] || '';
  const seasonFolder = /^(?:season|сезон|s)\s*\.?\s*\d+$/i.test(here);
  const guessShow = (seasonFolder ? parent : here) || 'Show';
  const sm = (seasonFolder ? here : '').match(/(\d{1,2})/);
  let guessSeason = sm ? +sm[1] : null;

  const rows = vids.map(p => {
    const name = p.name.split('/').pop();
    const dot = name.lastIndexOf('.');
    const g = guessEp(name);
    if (guessSeason == null && g.s != null) guessSeason = g.s;
    return { from: pathOf(p), old: name, ext: dot > 0 ? name.slice(dot) : '', ep: g.e || null, newName: '', bad: true };
  });
  if (guessSeason == null) guessSeason = 1;
  rows.forEach((r, i) => { if (!r.ep) r.ep = i + 1; });     // если не распознали — по порядку

  const existing = new Set(items.map(p => p.name.split('/').pop()));

  dialog(
    '<h3>Серии под формат Kodi</h3>' +
    '<div class="ep-form">' +
      '<label>Сериал<input id="epShow" type="text"></label>' +
      '<label class="season">Сезон<input id="epSeason" type="number" min="0"></label>' +
    '</div>' +
    '<div class="ep-note">Имя: <b>Сериал S01E01</b>. Номер серии можно поправить в строке.</div>' +
    '<div class="ep-list"></div>' +
    '<div class="acts"><button class="btn ghost" data-no>Отмена</button>' +
    '<button class="btn primary" data-yes>Переименовать</button></div>',
    m => {
      $('#modal').classList.add('wide');
      const showInp = m.querySelector('#epShow');
      const seasonInp = m.querySelector('#epSeason');
      const listEl = m.querySelector('.ep-list');
      const okBtn = m.querySelector('[data-yes]');
      showInp.value = guessShow;
      seasonInp.value = guessSeason;

      listEl.innerHTML = rows.map((r, i) =>
        '<div class="ep-row" data-i="' + i + '"><span class="ep-old"></span>' +
        '<span class="ep-arr">→</span><input class="epnum" type="number" min="1" inputmode="numeric">' +
        '<span class="ep-new"></span></div>').join('');
      const nodes = [...listEl.querySelectorAll('.ep-row')];
      nodes.forEach((node, i) => {
        node.querySelector('.ep-old').textContent = rows[i].old;
        const inp = node.querySelector('.epnum');
        inp.value = rows[i].ep;
        inp.oninput = () => { rows[i].ep = parseInt(inp.value, 10) || null; recompute(); };
      });

      function recompute() {
        const show = showInp.value.trim();
        const s = parseInt(seasonInp.value, 10);
        rows.forEach(r => {
          r.bad = false;
          if (!show || !(r.ep >= 1) || !(s >= 0)) { r.newName = ''; r.bad = true; }
          else r.newName = show + ' S' + pad2(s) + 'E' + pad2(r.ep) + r.ext;
        });
        const cnt = {};
        rows.forEach(r => { if (r.newName) cnt[r.newName] = (cnt[r.newName] || 0) + 1; });
        const oldSet = new Set(rows.map(r => r.old));
        rows.forEach(r => {
          if (r.bad) return;
          if (cnt[r.newName] > 1) r.bad = true;
          else if (r.newName !== r.old && existing.has(r.newName) && !oldSet.has(r.newName)) r.bad = true;
        });
        let anyBad = false, changes = 0;
        rows.forEach((r, i) => {
          const nn = nodes[i].querySelector('.ep-new');
          nn.textContent = r.newName || '—';
          nn.classList.toggle('bad', r.bad);
          nodes[i].classList.toggle('skip', !r.bad && r.newName === r.old);
          if (r.bad) anyBad = true;
          else if (r.newName !== r.old) changes++;
        });
        okBtn.disabled = anyBad || changes === 0;
        okBtn.textContent = changes ? 'Переименовать (' + changes + ')' : 'Переименовать';
      }
      showInp.oninput = recompute;
      seasonInp.oninput = recompute;
      m.querySelector('[data-no]').onclick = closeDialog;
      okBtn.onclick = async () => {
        if (okBtn.disabled) return;
        const jobs = rows.filter(r => !r.bad && r.newName && r.newName !== r.old);
        closeDialog();
        await applyRenames(cwd, jobs);
      };
      recompute();
    });
}

/** Переименование пачкой в одной папке. Через временные имена — чтобы E01→E02 не затирало. */
async function applyRenames(dir, jobs) {
  const base = rstrip(dir) === '/' ? '' : rstrip(dir);
  const fromSet = new Set(jobs.map(j => base + '/' + j.old));
  const overlap = jobs.some(j => fromSet.has(base + '/' + j.newName));
  // цели уже проверены на занятость в recompute(), перехлёст E01→E02 разводим через .eprn-*
  const mv = async (from, to) => {
    const r = await fetch(enc(from), {
      method: 'MOVE', headers: { Destination: location.origin + enc(to) } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  };
  let ok = 0, fail = 0;
  if (overlap) {
    const stamp = Date.now();
    const staged = [];
    for (let i = 0; i < jobs.length; i++) {
      const from = base + '/' + jobs[i].old;
      const tmp = base + '/.eprn-' + stamp + '-' + i;
      try { await mv(from, tmp); staged.push({ tmp, to: base + '/' + jobs[i].newName }); }
      catch (e) { fail++; }
    }
    for (const s of staged) {
      try { await mv(s.tmp, s.to); ok++; } catch (e) { fail++; }
    }
  } else {
    for (const j of jobs) {
      try { await mv(base + '/' + j.old, base + '/' + j.newName); ok++; } catch (e) { fail++; }
    }
  }
  if (ok) toast('Переименовано: ' + ok, 'ok');
  if (fail) toast('Не переименовано: ' + fail, 'err');
  refresh();
}

function download(p) {
  const url = enc(pathOf(p)) + (isDir(p) ? '?zip' : '');
  const a = document.createElement('a');
  a.href = url;
  if (!isDir(p)) a.download = p.name.split('/').pop();
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- загрузка файлов ---------- */
let queue = [], uploading = false;
function upload(files) {
  if (!caps.upload) { toast('Загрузка запрещена настройками сервера', 'err'); return; }
  for (const f of files) queue.push({ file: f, dir: cwd });
  if (!uploading) nextUpload();
}
function nextUpload() {
  if (!queue.length) {
    uploading = false;
    $('#up').classList.remove('on');
    toast('Загрузка завершена', 'ok');
    refresh();
    return;
  }
  uploading = true;
  const job = queue.shift();
  const total = queue.length + 1;
  $('#up').classList.add('on');
  $('#upTitle').textContent = total > 1 ? 'Загрузка (' + total + ' в очереди)' : 'Загрузка';
  $('#upName').textContent = job.file.name;
  $('#upBar').style.width = '0%';

  const xhr = new XMLHttpRequest();
  xhr.open('PUT', enc(join(job.dir, job.file.name)));
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) $('#upBar').style.width = (e.loaded / e.total * 100).toFixed(1) + '%';
  };
  xhr.onload = () => {
    if (xhr.status >= 400) toast('Не загрузился: ' + job.file.name, 'err');
    nextUpload();
  };
  xhr.onerror = () => { toast('Ошибка сети: ' + job.file.name, 'err'); nextUpload(); };
  xhr.send(job.file);
}

/* ---------- контекстное меню ---------- */
/* Меню открывают и файлы, и загрузки: держим размещение в одном месте. */
function placeMenu(x, y) {
  const m = $('#menu');
  m.style.display = 'block';
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
}

function showMenu(p, x, y) {
  const m = $('#menu');
  const dir = isDir(p);
  let html = '';
  html += '<button data-a="open">' + svg(dir ? ICONS.folder : ICONS.link) +
          (dir ? 'Открыть' : 'Открыть в браузере') + '</button>';
  if (caps.archive || !dir)
    html += '<button data-a="down">' + svg(ICONS.down) + (dir ? 'Скачать архивом' : 'Скачать') + '</button>';
  html += '<hr><button data-a="ren">' + svg(ICONS.pen) + 'Переименовать</button>';
  html += '<button data-a="move">' + svg(ICONS.move) + 'Переместить…</button>';
  if (caps.delete)
    html += '<button class="danger" data-a="del">' + svg(ICONS.trash) + 'Удалить</button>';
  m.innerHTML = html;
  placeMenu(x, y);

  m.onclick = async ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    hideMenu();
    const a = b.dataset.a;
    if (a === 'open') dir ? load(pathOf(p)) : window.open(enc(pathOf(p)), '_blank');
    else if (a === 'down') download(p);
    else if (a === 'ren') doRename(p);
    else if (a === 'move') doMove([p]);
    else if (a === 'del') doDelete([p]);
  };
}
const hideMenu = () => { $('#menu').style.display = 'none'; };
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('.more')) hideMenu();
}, true);
addEventListener('resize', hideMenu);
addEventListener('scroll', hideMenu, true);

    updateSelBar();

});

/* ---------- перетаскивание ---------- */

/* ---------- свободное место ---------- */
async function diskInfo() {
  try {
    const r = await fetch('/.diskinfo.json?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (!d.total) return;
    const used = d.total - d.free;
    $('#disk').hidden = false;
    $('#gaugeFill').style.width = Math.min(100, used / d.total * 100).toFixed(1) + '%';
    $('#gaugeFill').style.background = used / d.total > 0.9 ? 'var(--danger)' : 'var(--accent)';
    $('#diskText').textContent = 'свободно ' + fmtSize(d.free) + ' из ' + fmtSize(d.total);
  } catch (e) { /* файла нет — просто не показываем */ }
}

});

/* ---------- питание приставки ---------- */
/* Вебморда — файловый сервер, команд он не выполняет. Поэтому кнопка просто кладёт файл-команду
   в скрытую папку .control, а на приставке её подхватывает сторож power.sh: он корректно
   закрывает качалку (иначе она при следующем запуске полезет перепроверять все раздачи)
   и только потом перезагружает или выключает. */
async function power(kind) {
  const isOff = kind === 'poweroff';
  const ok = await ask(
    isOff ? 'Выключить приставку?' : 'Перезагрузить приставку?',
    'Загрузки будут остановлены аккуратно, поэтому пройдёт до полуминуты.' +
      (isOff ? ' Включить обратно можно только пультом.' : ''),
    isOff ? 'Выключить' : 'Перезагрузить', true);
  if (!ok) return;
  try {
    const r = await fetch('/.control/' + kind, { method: 'PUT', body: String(Date.now()) });
    if (!r.ok) throw new Error('сервер ответил ' + r.status);
    toast(isOff ? 'Выключаю — до полуминуты' : 'Перезагружаю — вернусь через минуту');
  } catch (e) {
    toast('Не получилось: ' + e.message, 'err');
  }
}
$('#btnReboot').onclick = () => power('reboot');
$('#btnPower').onclick  = () => power('poweroff');

async function screenCmd(cmd, done) {
  try {
    const r = await fetch('/.control/' + cmd, { method: 'PUT', body: String(Date.now()) });
    if (!r.ok) throw new Error('сервер ответил ' + r.status);
    toast(done);
  } catch (e) {
    toast('Не получилось: ' + e.message, 'err');
  }
}
async function sleepBox() {
  const ok = await ask('Усыпить приставку?',
    'Погаснет только экран, как кнопкой на пульте. Загрузки, бот и сеть продолжат работать.',
    'Усыпить');
  if (ok) screenCmd('sleep', 'Приставка засыпает — разбудить можно пультом или солнцем');
}
$('#btnSleep').onclick = sleepBox;
$('#btnWake').onclick = () => screenCmd('wake', 'Приставка просыпается');

/* Качалка закрывается на время фильма и поднимается сама через 20 спокойных минут — чтобы не
   дёргаться туда-сюда, когда кино ставят на паузу. Эта кнопка отменяет ожидание. */
async function qbtOn() {
  if (!await ask('Включить загрузки сейчас?',
        'Обычно они включаются сами через 20 минут после фильма.', 'Включить')) return false;
  try {
    const r = await fetch('/.control/qbt-on', { method: 'PUT', body: String(Date.now()) });
    if (!r.ok) throw new Error('сервер ответил ' + r.status);
    toast('Включаю загрузки');
    return true;
  } catch (e) {
    toast('Не получилось: ' + e.message, 'err');
    return false;
  }
}
$('#btnQbt').onclick = qbtOn;

/* ---------- вкладки: файлы и загрузки ---------- */
/* Качалка — отдельная программа (qBittorrent) со своим веб-сервером на порту 8080, эта
   страница живёт на 8777. Показать её внутри рамкой нельзя: её собственный файл
   color-scheme.js первой же строкой читает window.parent.qBittorrent, а из чужого порта
   браузер это запрещает. Скрипт падает, и от интерфейса остаётся пустая страница — без
   списка загрузок и без панели фильтров слева. Поэтому вкладка «Загрузки» — свой экран
   поверх её API, а её родной интерфейс остаётся по ссылке «Полная качалка» для редких
   настроек.

   Чтобы браузер разрешил читать ответы с чужого порта, в качалке включён заголовок
   Access-Control-Allow-Origin ровно с адресом этой страницы (Настройки → Веб-интерфейс →
   «Использовать нестандартные HTTP-заголовки»). Именно с адресом, а не со звёздочкой:
   вход в качалку разрешён всей домашней подсети без пароля, и со звёздочкой её список и
   кнопку «удалить» получил бы любой сайт, открытый на любом устройстве дома.

   Жёсткое ограничение: на запрос OPTIONS качалка отвечает «501 Not Implemented», то есть
   предварительную проверку (preflight) не переживёт ни один запрос. Значит общаться можно
   только простыми запросами: GET либо POST с FormData. Ни своих заголовков, ни JSON,
   ни PUT/DELETE — иначе запрос умрёт, а в консоли это будет выглядеть как «CORS не
   настроен», хотя настроен. */
const QBT = location.protocol + '//' + location.hostname + ':8080/';
const QBT_ORIGIN = 'http://192.168.1.10:8777';
const paneEl = $('#dlpane'), noteEl = $('#dlnote'), listEl = $('#dllist'), sumEl = $('#dlsum');

async function qapi(path, form) {
  const r = await fetch(QBT + 'api/v2/' + path, form ? { method: 'POST', body: form }
                                                     : { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 409 ? 'качалка не приняла ссылку'
                                              : 'качалка ответила ' + r.status);
  return r;
}

/* Названия состояний у качалки английские и техничные; показываем человеческие.
   В пятой версии paused переименовали в stopped — держим оба написания. */
const DL_STATE = {
  error: 'ошибка', missingFiles: 'файлы пропали',
  downloading: 'качается', forcedDL: 'качается',
  stalledDL: 'ищет раздающих', metaDL: 'читает торрент', forcedMetaDL: 'читает торрент',
  queuedDL: 'в очереди', allocating: 'готовит место', moving: 'переносится',
  checkingDL: 'проверяется', checkingUP: 'проверяется', checkingResumeData: 'проверяется',
  pausedDL: 'на паузе', stoppedDL: 'на паузе',
  pausedUP: 'готово', stoppedUP: 'готово',
  uploading: 'раздаётся', stalledUP: 'раздаётся', forcedUP: 'раздаётся', queuedUP: 'в очереди',
  unknown: 'непонятно'
};
const dlPaused = t => /^(paused|stopped)/.test(t.state);
const dlDone = t => t.progress >= 1;

function fmtSpeed(b) { return fmtSize(b) + '/с'; }

/* Раздающие: num_seeds — с кем качалка реально соединилась, num_complete — сколько их
   всего знает трекер. Второе число важнее первого: если раздающих в природе мало, то
   быстрее уже не будет, сколько ни жди. Трекер часто молчит и присылает -1 или ноль —
   тогда показываем только своих, без «из». */
function fmtSeeds(t) {
  const now = t.num_seeds, all = t.num_complete;
  if (typeof now !== 'number') return '';
  if (!now && !(all > 0)) return 'раздающих нет';
  return 'раздающих ' + now + (all > now ? ' из ' + all : '');
}
function fmtEta(sec) {
  if (!sec || sec >= 8640000) return '';
  if (sec < 60) return 'меньше минуты';
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  if (h >= 48) return 'больше двух суток';
  if (h >= 24) return 'больше суток';
  return (h ? h + ' ч ' : '') + m + ' мин';
}

let dlRid = 0, dlList = {}, dlServer = {}, dlTimer = null, dlBusy = false;
let dlFails = 0, dlSeen = false, dlActive = false;
const dlRows = new Map();

function dlNote(title, text, buttons) {
  noteEl.innerHTML = '<h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(text) + '</p>' + (buttons || '');
  noteEl.hidden = false;
  listEl.hidden = true;
  sumEl.textContent = '';
}

/* Качалку закрывают на время фильма — это обычное дело, а не поломка. Отдельно
   подсказываем про адрес: заголовок в качалке прописан ровно под него, и со страницы,
   открытой по другому имени хоста, ответы читать не дадут — со стороны это выглядит так же,
   как «не отвечает». */
function dlOffline() {
  const wrongHost = location.origin !== QBT_ORIGIN;
  dlNote('Качалка сейчас не отвечает',
    wrongHost
      ? 'Либо она закрыта на время фильма, либо страница открыта по другому адресу — качалка отдаёт данные только странице по адресу ' + QBT_ORIGIN
      : 'Она закрывается на время фильма и поднимается сама через 20 спокойных минут.',
    '<button class="btn primary" id="dlOn">Включить загрузки</button> ' +
    '<button class="btn" id="dlRetry">Обновить</button>');
  $('#dlOn').onclick = async () => {
    if (!await qbtOn()) return;
    dlNote('Поднимаю качалку', 'Ей нужно несколько секунд.');
    setTimeout(() => { dlFails = 0; dlTick(); }, 5000);
  };
  $('#dlRetry').onclick = () => { dlFails = 0; dlTick(); };
}

/* Качалка умеет отдавать не весь список, а только то, что изменилось с прошлого ответа:
   отдаём ей номер прошлого ответа (rid) и доклеиваем изменения к тому, что уже знаем. */
async function dlTick() {
  if (dlBusy || !dlActive) return;
  dlBusy = true;
  try {
    const d = await (await qapi('sync/maindata?rid=' + dlRid)).json();
    if (d.full_update) { dlList = {}; }
    dlRid = d.rid || 0;
    for (const h in (d.torrents || {})) dlList[h] = Object.assign(dlList[h] || {}, d.torrents[h]);
    for (const h of (d.torrents_removed || [])) delete dlList[h];
    dlServer = Object.assign(dlServer, d.server_state || {});
    dlFails = 0; dlSeen = true;
    noteEl.hidden = true; listEl.hidden = false;
    dlRender();
  } catch (e) {
    dlFails++;
    /* Первая же осечка на пустом месте — значит качалка закрыта. А вот если список уже
       показан, одиночный сбой сети не должен стирать его с экрана. */
    if (dlFails >= (dlSeen ? 3 : 1)) { dlRid = 0; dlList = {}; dlRows.clear(); dlSeen = false; dlOffline(); }
  } finally {
    dlBusy = false;
  }
}

/* Пустую ячейку прячем целиком: у шапки flex-зазор, и пустой span оставил бы дыру. */
function dlSum(key, text) {
  const el = sumEl.querySelector('[data-s="' + key + '"]');
  el.textContent = text;
  el.hidden = !text;
}

$('#dlsum').querySelector('[data-s="cap"]').onclick = () => toast(
  'Потолок держит сторож приставки: 6 МБ/с по кабелю, 4 МБ/с когда винчестер не ' +
  'справляется. Выше он не поднимается: диск не успевает писать, и кино начинает ' +
  'дёргаться. На время фильма качалка не придерживается, а гасится целиком.');

function dlRowEl(h) {
  let el = dlRows.get(h);
  if (el) return el;
  el = document.createElement('div');
  el.className = 'dlrow';
  el.innerHTML =
    '<div class="dlhead"><span class="dlname"></span><span class="dlpct"></span>' +
    '<button class="more" title="Ещё">' + svg(ICONS.dots) + '</button></div>' +
    '<div class="track"><i></i></div>' +
    '<div class="dlmeta"><span data-f="st"></span><span data-f="sz"></span>' +
    '<span data-f="sp"></span><span data-f="sd"></span><span data-f="eta"></span></div>';
  el.querySelector('.more').onclick = ev => {
    ev.stopPropagation();
    const r = ev.currentTarget.getBoundingClientRect();
    dlMenu(h, r.right - 190, r.bottom + 6);
  };
  dlRows.set(h, el);
  return el;
}

function dlRender() {
  const hashes = Object.keys(dlList);
  if (!hashes.length) {
    listEl.innerHTML = '<div class="dlempty">Пока ничего не качается.<br>' +
      'Нажми «Добавить» и вставь magnet-ссылку или файл .torrent.</div>';
    dlRows.clear();
    sumEl.textContent = '';
    return;
  }
  /* Сверху то, что сейчас качается, потом отложенное, внизу готовое; внутри группы
     что добавили позже, то выше. */
  const rank = t => dlDone(t) ? 2 : dlPaused(t) ? 1 : 0;
  hashes.sort((a, b) => (rank(dlList[a]) - rank(dlList[b])) ||
                        ((dlList[b].added_on || 0) - (dlList[a].added_on || 0)));

  const stub = listEl.querySelector('.dlempty');
  if (stub) stub.remove();
  for (const h of dlRows.keys()) if (!dlList[h]) { dlRows.get(h).remove(); dlRows.delete(h); }

  for (const h of hashes) {
    const t = dlList[h], el = dlRowEl(h);
    const pct = Math.min(100, Math.round((t.progress || 0) * 1000) / 10);
    const done = dlDone(t), paused = dlPaused(t), bad = t.state === 'error' || t.state === 'missingFiles';

    el.querySelector('.dlname').textContent = t.name || '…';
    el.querySelector('.dlname').title = t.name || '';
    el.querySelector('.dlpct').textContent = done ? '' : pct + '%';
    const bar = el.querySelector('.track');
    bar.className = 'track' + (bad ? ' bad' : done ? ' done' : paused ? ' idle' : '');
    bar.firstChild.style.width = (done ? 100 : pct) + '%';

    const st = DL_STATE[t.state] || t.state || '';
    el.querySelector('[data-f="st"]').textContent = st;
    el.querySelector('[data-f="sz"]').textContent = done || !t.size
      ? fmtSize(t.size || 0)
      : fmtSize(Math.round((t.progress || 0) * t.size)) + ' из ' + fmtSize(t.size);
    el.querySelector('[data-f="sp"]').textContent = t.dlspeed > 0 ? '↓ ' + fmtSpeed(t.dlspeed) : '';
    el.querySelector('[data-f="sd"]').textContent = done || paused ? '' : fmtSeeds(t);
    el.querySelector('[data-f="eta"]').textContent = done || paused ? '' : fmtEta(t.eta);

    listEl.appendChild(el);
  }

  const dn = dlServer.dl_info_speed || 0, up = dlServer.up_info_speed || 0;
  dlSum('dn', (dn || up) ? '↓ ' + fmtSpeed(dn) : '');
  dlSum('up', (dn || up) ? '↑ ' + fmtSpeed(up) : '');
  /* Потолок ставит сторож, а не человек, и меняет его несколько раз в день — без этой
     строчки загрузка просто «упирается в круглое число», и непонятно, кто её держит. */
  dlSum('cap', dlServer.dl_rate_limit > 0 ? 'потолок ' + fmtSpeed(dlServer.dl_rate_limit) : '');
}

function dlMenu(h, x, y) {
  const t = dlList[h];
  if (!t) return;
  const paused = dlPaused(t);
  $('#menu').innerHTML =
    '<button data-a="' + (paused ? 'start' : 'stop') + '">' +
      svg(paused ? ICONS.play : ICONS.pause) + (paused ? 'Продолжить' : 'Пауза') + '</button>' +
    '<button data-a="dir">' + svg(ICONS.folder) + 'Показать папку</button>' +
    '<hr><button class="danger" data-a="del">' + svg(ICONS.trash) + 'Удалить…</button>';
  placeMenu(x, y);

  $('#menu').onclick = async ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    hideMenu();
    const a = b.dataset.a;
    try {
      if (a === 'start' || a === 'stop') {
        const f = new FormData();
        f.append('hashes', h);
        /* В пятой версии ручки называются start/stop, в четвёртой — resume/pause.
           Если имя не то, качалка отвечает 404 — тогда пробуем старое. */
        try { await qapi('torrents/' + a, f); }
        catch (e) { await qapi('torrents/' + (a === 'start' ? 'resume' : 'pause'), f); }
        dlFails = 0; dlTick();
      } else if (a === 'dir') {
        dlOpenFolder(t);
      } else if (a === 'del') {
        const withFiles = await askDelete(t.name || '');
        if (withFiles === null) return;
        const f = new FormData();
        f.append('hashes', h);
        f.append('deleteFiles', withFiles ? 'true' : 'false');
        await qapi('torrents/delete', f);
        delete dlList[h];
        const el = dlRows.get(h);
        if (el) { el.remove(); dlRows.delete(h); }
        dlRender();
        toast(withFiles ? 'Удалил вместе с файлами' : 'Убрал из списка');
      }
    } catch (e) {
      toast('Не получилось: ' + e.message, 'err');
    }
  };
}

/* Три ответа вместо двух, поэтому не через ask(): «отмена» — null,
   «только из списка» — false, «вместе с файлами» — true. */
function askDelete(name) {
  return new Promise(res => {
    dialog('<h3>Удалить загрузку?</h3><p></p><div class="acts">' +
      '<button class="btn ghost" data-no>Отмена</button>' +
      '<button class="btn" data-keep>Только из списка</button>' +
      '<button class="btn warn" data-all>И файлы тоже</button></div>',
      m => {
        m.querySelector('p').textContent = name;
        m.querySelector('[data-no]').onclick = () => { closeDialog(); res(null); };
        m.querySelector('[data-keep]').onclick = () => { closeDialog(); res(false); };
        m.querySelector('[data-all]').onclick = () => { closeDialog(); res(true); };
        m.querySelector('[data-no]').focus();
      });
  });
}

/* Качалка знает папку как путь внутри приставки (/mnt/media_rw/…/Download), а файловая
   вкладка — как путь от корня диска (/Download). Общее у них — имя папки верхнего уровня,
   по нему и сшиваем. */
async function dlOpenFolder(t) {
  const segs = String(t.save_path || '').replace(/\\/g, '/').split('/').filter(Boolean);
  try {
    const r = await fetch('/?json', { headers: { Accept: 'application/json' } });
    const top = ((await r.json()).paths || []).map(p => p.name);
    for (let i = 0; i < segs.length; i++) {
      if (top.indexOf(segs[i]) >= 0) {
        setTab('files');
        load('/' + segs.slice(i).join('/'));
        return;
      }
    }
  } catch (e) { /* ниже общий ответ */ }
  toast('Не нашёл эту папку на диске', 'err');
}

function dlAddDialog() {
  dialog('<h3>Добавить загрузку</h3>' +
    '<p>Вставь magnet-ссылку — можно несколько, каждую с новой строки. Или выбери файл .torrent.</p>' +
    '<textarea rows="4" placeholder="magnet:?xt=urn:btih:…"></textarea>' +
    '<input type="file" accept=".torrent,application/x-bittorrent" multiple>' +
    '<div class="acts"><button class="btn ghost" data-no>Отмена</button>' +
    '<button class="btn primary" data-yes>Добавить</button></div>',
    m => {
      const ta = m.querySelector('textarea'), file = m.querySelector('input[type=file]');
      m.querySelector('[data-no]').onclick = closeDialog;
      m.querySelector('[data-yes]').onclick = async () => {
        const urls = ta.value.trim(), files = file.files;
        if (!urls && !files.length) { toast('Нечего добавлять', 'err'); return; }
        closeDialog();
        const f = new FormData();
        if (urls) f.append('urls', urls);
        for (const x of files) f.append('torrents', x, x.name);
        try {
          /* Пятая версия отвечает сводкой в JSON, четвёртая — коротким «Ok.»: понимаем обе. */
          const txt = (await (await qapi('torrents/add', f)).text()).trim();
          if (txt && txt !== 'Ok.') {
            let d = null;
            try { d = JSON.parse(txt); } catch (err) { throw new Error(txt); }
            if (d.failure_count) throw new Error('качалка не приняла ' + d.failure_count +
              plural(d.failure_count, ' ссылку', ' ссылки', ' ссылок'));
          }
          toast('Добавил');
          dlFails = 0; dlTick();
        } catch (e) {
          toast('Не добавилось: ' + e.message, 'err');
        }
      };
      ta.focus();
    });
}
$('#dlAdd').onclick = dlAddDialog;

/* Спрашиваем качалку раз в две секунды и только пока вкладка открыта и видна: в свёрнутом
   браузере опрос молчит, чтобы зря не будить приставку и не копить очередь на её порту. */
function dlPoll(on) {
  dlActive = on;
  clearInterval(dlTimer);
  dlTimer = null;
  if (!on) return;
  if (!dlSeen) listEl.innerHTML = '<div class="dlempty">Спрашиваю качалку…</div>';
  dlTick();
  dlTimer = setInterval(() => { if (!document.hidden) dlTick(); }, 2000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) dlTick(); });

const VPN = `http://${location.hostname}:8778/`;
const vpnPane = $('#vpnpane'), vpnFrame = $('#vpnframe');

function setTab(name) {
  const dl = name === 'dl', vpn = name === 'vpn';
  document.body.classList.toggle('dl-mode', dl);
  document.body.classList.toggle('vpn-mode', vpn);
  vpnPane.hidden = !vpn;
  if (vpn && !vpnFrame.src) vpnFrame.src = VPN;
  for (const b of document.querySelectorAll('.tab')) b.classList.toggle('on', b.dataset.tab === name);
  paneEl.hidden = !dl;
  $('#dlOut').hidden = !dl;
  dlPoll(dl);
}

$('#dlOut').href = QBT;
for (const b of document.querySelectorAll('.tab')) b.onclick = () => setTab(b.dataset.tab);

/* ---------- свайп между вкладками на телефоне ---------- */
/* Палец справа налево — следующая вкладка, слева направо — предыдущая, по кругу не ходим.
   Не считаем свайпом: движение от самого края экрана (там у телефона свой жест «назад»),
   касание двумя пальцами, поля ввода и всё, что само листается вбок. Касания внутри рамки
   VPN сюда не доходят — панель живёт на другом порту, поэтому она ловит свайп сама и
   присылает его сообщением. */
const TABS = ['vpn', 'files', 'dl'];

function swipeTab(dir) {
  if ($('#veil').classList.contains('on') || getComputedStyle($('#menu')).display !== 'none') return;
  const i = TABS.indexOf(document.querySelector('.tab.on')?.dataset.tab) + dir;
  if (i >= 0 && i < TABS.length) setTab(TABS[i]);
}

function scrollsSideways(el) {
  for (; el && el !== document.body; el = el.parentElement) {
    if (el.matches('input, textarea, select, [contenteditable]')) return true;
    const o = getComputedStyle(el).overflowX;
    if ((o === 'auto' || o === 'scroll') && el.scrollWidth > el.clientWidth + 1) return true;
  }
  return false;
}

let sw = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  sw = e.touches.length > 1 || t.clientX < 24 || t.clientX > innerWidth - 24 || scrollsSideways(e.target)
    ? null : { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!sw || e.touches.length) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (Date.now() - sw.at < 700 && Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) swipeTab(dx < 0 ? 1 : -1);
  sw = null;
}, { passive: true });
addEventListener('message', e => {
  if (e.source !== vpnFrame.contentWindow || e.origin !== new URL(VPN).origin) return;
  const dir = e.data && e.data.tabSwipe;
  if (dir === 1 || dir === -1) swipeTab(dir);
});

/* ---------- старт ---------- */
let startTab = 'vpn';
if (location.pathname !== '/' || location.search) startTab = 'files';
setTab(startTab);
load(cwd, { keepUrl: true });
diskInfo();
setInterval(diskInfo, 60000);
</script>
